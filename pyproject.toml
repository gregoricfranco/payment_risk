[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-risk-ai"
version = "0.1.0"
description = "Infrastructure for the Payment Risk AI service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "psycopg[binary]==3.2.6",
    "pydantic-settings==2.8.1",
    "redis==5.2.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
